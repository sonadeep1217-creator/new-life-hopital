<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Panel | New Life Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a href="../index.html" class="logo"><div class="logo-icon"><i class="fas fa-heartbeat"></i></div><span>New Life Hospital</span></a>
      <nav class="nav-links">
        <span id="user-greeting" style="font-weight:600;color:var(--primary);"></span>
        <button onclick="Auth.logout()" class="btn btn-secondary btn-sm">Logout</button>
      </nav>
    </div>
  </header>

  <div class="panel-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>Doctor Panel</h3>
        <p id="side-name"></p>
      </div>
      <nav class="sidebar-menu">
        <a href="#dashboard" class="active" data-section="dashboard"><i class="fas fa-home"></i> Dashboard</a>
        <a href="#appointments" data-section="appointments"><i class="fas fa-calendar-check"></i> Appointments</a>
        <a href="#patients" data-section="patients"><i class="fas fa-users"></i> Patients</a>
      </nav>
    </aside>

    <main class="panel-main">
      <section id="sec-dashboard">
        <div class="panel-header"><h1>Doctor Dashboard</h1></div>
        <div class="stats-row">
          <div class="stat-card"><div class="stat-value" id="stat-today">0</div><div class="stat-label">Today's Appointments</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-pending">0</div><div class="stat-label">Pending Confirmation</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Assigned</div></div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:12px;">Today's Schedule</h3>
          <div id="today-list"></div>
        </div>
      </section>

      <section id="sec-appointments" class="hidden">
        <div class="panel-header"><h1>All Appointments</h1></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Patient</th><th>Phone</th><th>Date</th><th>Time</th><th>Type</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="appts-table"></tbody>
          </table>
        </div>
      </section>

      <section id="sec-patients" class="hidden">
        <div class="panel-header"><h1>My Patients</h1></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Phone</th><th>Diabetes Type</th><th>Blood Group</th></tr>
            </thead>
            <tbody id="patients-table"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const session = Auth.require(['doctor']);
    if (!session) throw new Error('Auth');

    document.getElementById('user-greeting').textContent = session.name;
    document.getElementById('side-name').textContent = session.name;

    const doctorId = session.doctorId;
    let appointments = DB.get('appointments').filter(a => a.doctorId === doctorId);

    function refresh() {
      appointments = DB.get('appointments').filter(a => a.doctorId === doctorId);
      const today = new Date().toISOString().split('T')[0];
      const todayAppts = appointments.filter(a => a.date === today);
      document.getElementById('stat-today').textContent = todayAppts.length;
      document.getElementById('stat-pending').textContent = appointments.filter(a => a.status === 'pending').length;
      document.getElementById('stat-total').textContent = appointments.length;

      document.getElementById('today-list').innerHTML = todayAppts.length ? todayAppts.map(a => `
        <div style="padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
          <div><strong>${a.patientName}</strong> · ${a.time} · ${a.type}</div>
          <span class="badge-status badge-${a.status}">${a.status}</span>
        </div>
      `).join('') : '<p style="color:var(--gray);">No appointments scheduled for today.</p>';

      document.getElementById('appts-table').innerHTML = appointments.map(a => `
        <tr>
          <td>${a.patientName}</td>
          <td>${a.phone}</td>
          <td>${formatDate(a.date)}</td>
          <td>${a.time}</td>
          <td>${a.type}</td>
          <td><span class="badge-status badge-${a.status}">${a.status}</span></td>
          <td>
            ${a.status === 'pending' ? `<button class="btn btn-primary btn-sm" onclick="updateStatus('${a.id}','confirmed')">Confirm</button>` : ''}
            ${a.status === 'confirmed' ? `<button class="btn btn-secondary btn-sm" onclick="updateStatus('${a.id}','completed')">Complete</button>` : ''}
          </td>
        </tr>
      `).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--gray);">No appointments.</td></tr>';
    }

    function updateStatus(id, status) {
      DB.update('appointments', id, { status });
      refresh();
    }

    // Patients linked via appointments
    const patientNames = [...new Set(appointments.map(a => a.patientName))];
    const patients = DB.get('patients').filter(p => patientNames.includes(p.name));
    document.getElementById('patients-table').innerHTML = patients.map(p => `
      <tr>
        <td>${p.name}</td>
        <td>${p.phone}</td>
        <td>${p.diabetesType}</td>
        <td>${p.bloodGroup}</td>
      </tr>
    `).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--gray);">No patients yet.</td></tr>';

    refresh();

    document.querySelectorAll('.sidebar-menu a[data-section]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        ['dashboard','appointments','patients'].forEach(s => {
          document.getElementById('sec-' + s).classList.toggle('hidden', s !== link.dataset.section);
        });
        document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
        link.classList.add('active');
      });
    });
  </script>
</body>
</html>
