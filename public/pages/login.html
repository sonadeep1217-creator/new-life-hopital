<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | New Life Diabetic Hospital Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" data-animate>
      <div style="text-align:center;margin-bottom:8px;">
        <div class="logo-icon" style="margin:0 auto 12px;"><i class="fas fa-heartbeat"></i></div>
      </div>
      <h2>Portal Login</h2>
      <p class="subtitle">Patient · Doctor · Admin access</p>

      <div class="tabs">
        <button class="tab-btn active" data-role="patient">Patient</button>
        <button class="tab-btn" data-role="doctor">Doctor</button>
        <button class="tab-btn" data-role="admin">Admin</button>
      </div>

      <div id="login-alert"></div>

      <form id="login-form">
        <input type="hidden" name="role" id="role-input" value="patient" />
        <div class="form-group">
          <label id="user-label">Email / Phone</label>
          <input type="text" name="username" class="form-control" required placeholder="Enter email or phone" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required placeholder="Enter password" />
        </div>
        <button type="submit" class="btn btn-primary w-full"><i class="fas fa-sign-in-alt"></i> Login</button>
      </form>

      <div style="margin-top:24px;padding:16px;background:var(--light);border-radius:8px;font-size:0.85rem;color:var(--gray);">
        <strong>Demo Credentials:</strong><br>
        <b>Patient:</b> ramesh@email.com / patient123<br>
        <b>Doctor:</b> dr.rajesh / doctor123<br>
        <b>Admin:</b> admin / admin123
      </div>

      <p style="text-align:center;margin-top:20px;font-size:0.9rem;">
        <a href="../index.html" style="color:var(--primary);">← Back to Website</a>
      </p>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const tabs = document.querySelectorAll('.tab-btn');
    const roleInput = document.getElementById('role-input');
    const userLabel = document.getElementById('user-label');

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        roleInput.value = btn.dataset.role;
        if (btn.dataset.role === 'patient') {
          userLabel.textContent = 'Email / Phone';
        } else {
          userLabel.textContent = 'Username';
        }
      });
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const username = fd.get('username');
      const password = fd.get('password');
      const role = fd.get('role');

      const session = Auth.login(username, password, role);
      if (session) {
        showAlert(document.getElementById('login-alert'), 'Login successful! Redirecting...', 'success');
        setTimeout(() => {
          if (session.role === 'admin') window.location.href = 'admin.html';
          else if (session.role === 'doctor') window.location.href = 'doctor.html';
          else window.location.href = 'patient.html';
        }, 800);
      } else {
        showAlert(document.getElementById('login-alert'), 'Invalid credentials. Please try again.', 'error');
      }
    });
  </script>
</body>
</html>
